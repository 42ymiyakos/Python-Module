[settings]
# python-build-standalone の古いビルド (3.10.12) には GitHub artifact attestations がないため
python.github_attestations = false

[tools]
python = "3.10.12"

[tasks.flake8]
description = "Run flake8 (default: whole repo)"
run = "uv run flake8"

[tasks.mypy]
description = "Run mypy (default: whole repo)"
usage = 'arg "[path]..." default="."'
run = 'uv run mypy {{usage.path | join(sep=" ")}}'

[tasks.check]
description = "Run flake8 and mypy"
depends = ["flake8", "mypy"]
